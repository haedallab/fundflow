services:
  - type: web
    name: fundflow-api
    runtime: python
    rootDir: backend
    buildFilter:              # API 코드가 바뀔 때만 다시 배포 (수집기·화면 수정은 무시)
      paths:
        - backend/**
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL       # Supabase > Connect > Session pooler 문자열
        sync: false
      - key: CORS_ORIGINS
        value: "*"
