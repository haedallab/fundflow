# DART 펀드공시를 2시간마다 수집해 Supabase에 반영
#   A 공시 목록(OpenAPI) → B 파싱 대상 선정 → C 원문 파싱(DART 웹 뷰어) → D 펀드 갱신
# 필요 Secrets (Settings > Secrets and variables > Actions): DART_API_KEY, DATABASE_URL
name: collect

on:
  schedule:
    - cron: "17 */2 * * *"      # 2시간마다 (정각 혼잡을 피해 17분)
  push:                          # 수집기 코드가 바뀌면 바로 한 번 실행
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "원문 파싱 시간 한도(분)"
        default: "100"
      rebuild:
        description: "펀드 테이블 전체 재계산 (1 = 예)"
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '100' }}
          REBUILD: ${{ github.event.inputs.rebuild }}
        run: python -u collector/run.py
