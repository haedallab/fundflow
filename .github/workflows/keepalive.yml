# 무료 Render 서버는 15분간 요청이 없으면 잠들어 첫 접속이 30~60초 걸리므로 10분마다 깨워 둠
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 90 -o /dev/null -w "health %{http_code} %{time_total}s\n" https://fundflow-api-scjl.onrender.com/health || true
