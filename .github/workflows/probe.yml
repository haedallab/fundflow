name: probe
on:
  push:
    branches: [probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - env: { DART_API_KEY: "${{ secrets.DART_API_KEY }}" }
        run: python probe/probe3.py 2>&1 | tee samples_log.txt
      - run: |
          mkdir -p samples3 && mv samples_log.txt samples3/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -B probe-samples
          git add samples3 && git commit -qm "probe samples" && git push -f origin probe-samples
